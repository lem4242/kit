# What install.sh installs, each at a release tag.

[kit]
marketplace = "kit"
marketplace_repo = "lem4242/kit"

[tools.alta]
repo = "lem4242/alta"
tag = "v0.1.35"
setup = "alta init"
setup_no_background = "--no-job"

[tools.coro]
repo = "lem4242/coro"
tag = "v0.1.2"
plugin = "coro"
# Repos that coro's own pins fetch: the access check reads them too.
reads = "lem4242/lazo"
